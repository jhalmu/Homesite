services:
  app:
    image: ghcr.io/jhalmu/homesite:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://homesite:${DB_PASSWORD}@db/homesite_prod"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      PHX_HOST: "${PHX_HOST}"
      PHX_CHECK_ORIGIN_HOSTS: "${PHX_CHECK_ORIGIN_HOSTS}"
      PHX_SERVER: "true"
      PORT: "4000"
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      UPLOADS_PATH: "/app/uploads"
      MAXMIND_LICENSE_KEY: "${MAXMIND_LICENSE_KEY}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY}"
      ABUSEIPDB_API_KEY: "${ABUSEIPDB_API_KEY}"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
      - caddy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      # PostgreSQL 18+ uses /var/lib/postgresql as VOLUME (PGDATA is version-specific)
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: homesite
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: homesite_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homesite -d homesite_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PHX_HOST: "${PHX_HOST}"
      PHX_ALTERNATE_HOST: "${PHX_ALTERNATE_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/uploads:ro
    depends_on:
      - app
    networks:
      - caddy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uploads_data:

networks:
  internal:
  caddy:
