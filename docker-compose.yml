services:
  app:
    image: ghcr.io/jhalmu/homesite:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "ecto://homesite:${DB_PASSWORD}@db/homesite_prod"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE}"
      PHX_HOST: "${PHX_HOST}"
      PHX_SERVER: "true"
      PORT: "4000"
    networks:
      - internal
      - caddy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: homesite
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: homesite_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homesite -d homesite_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - caddy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
  caddy:
